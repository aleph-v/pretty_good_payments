[profile.default]
src = "src"
out = "out"
libs = ["lib"]
fs_permissions = [{ access = "read", path = "./"}, { access = "read", path = "/tmp"}, { access = "write", path = "./config"}, { access = "write", path = "./config.toml"}]
ffi = true
no_match_coverage = "test/*"
via_ir = true
optimizer = true
optimizer_runs = 20000

[lint]
exclude_lints = [
    "mixed-case-variable",
    "unsafe-cheatcode",
    "mixed-case-function",
    "divide-before-multiply",
    "screaming-snake-case-immutable",
    "unsafe-typecast",
    "asm-keccak256"
]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
