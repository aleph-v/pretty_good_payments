# Pretty Good Payments - Challenger Configuration
#
# Copy this file to challenger.toml and update with your values.
# Environment variables can be used for secrets: ${ENV_VAR_NAME}
#
# Run GenerateConfig.s.sol after deployment to auto-generate with contract addresses.

[network]
# Execution layer RPC endpoint
rpc_url = "http://localhost:8545"

# Beacon chain RPC (required for non-Anvil networks to fetch blobs)
# Anvil has native blob methods, so this is optional for local development
# beacon_url = "http://localhost:5052"

# Network chain ID (31337 for Anvil, 11155111 for Sepolia)
chain_id = 31337

[contracts]
# Entrypoint contract address (main PGP contract)
entrypoint = "0x5FbDB2315678afecb367f032d93F642f64180aa3"

# Transaction registry contract address
transaction_registry = "0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512"

[challenger]
# Private key for submitting challenge transactions
# SECURITY: Use environment variable in production
private_key = "${CHALLENGER_PRIVATE_KEY}"

# How often to poll for new blocks (milliseconds)
poll_interval_ms = 2000

# Number of blocks to look back on startup for unprocessed blocks
lookback_blocks = 100

# Gas settings for challenge transactions
max_gas_price_gwei = 100
challenge_gas_limit = 500000

# Enable/disable specific fraud validators
[challenger.validators]
# Check ZK proofs on transfer transactions
transaction_zk = true

# Check deposit leaves match L1 deposit events
deposit = true

# Track and detect double-spend nullifier reuse
nullifier = true

# Verify merkle tree update computations
tree_update = true

[storage]
# SQLite database path for persistent state (nullifier tracking, processed blocks)
db_path = "./data/challenger.db"

[logging]
# Log level: trace, debug, info, warn, error
level = "info"

# Log format: pretty (human-readable), json (structured)
format = "pretty"

[metrics]
# Enable Prometheus metrics endpoint
enabled = false

# Port for metrics server (if enabled)
# prometheus_port = 9090
